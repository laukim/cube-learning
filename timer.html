<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0b1210" />
    <meta name="description" content="3×3 timer and scramble — times stay on this device." />
    <title>Timer — 3×3 Coach</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Syne:wght@700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css?v=best2" />
  </head>
  <body class="timer-page">
    <div class="ambient" aria-hidden="true"></div>

    <header class="topbar">
      <a class="brand" href="./">
        <span class="brand-mark" aria-hidden="true"></span>
        <span class="brand-name">3×3 Coach</span>
      </a>
      <nav class="site-nav" aria-label="App pages">
        <a class="site-nav-link" href="./">Coach</a>
        <a class="site-nav-link is-active" href="./timer.html" aria-current="page">Timer</a>
      </nav>
    </header>

    <main class="timer-page-main">
      <section class="timer-stage" aria-label="Scramble and timer">
        <p class="practice-scramble-kicker">Scramble</p>
        <button type="button" class="practice-scramble" id="practice-scramble" title="Tap for a new scramble" aria-label="Current scramble. Tap for a new scramble.">
          —
        </button>
        <div class="timer-mode" role="group" aria-label="Timer mode">
          <button type="button" class="timer-mode-btn is-active" data-timer-mode="single" aria-pressed="true">
            Single
          </button>
          <button type="button" class="timer-mode-btn" data-timer-mode="splits" aria-pressed="false">
            Cross · F2L · Final
          </button>
        </div>
        <button type="button" class="practice-clock" id="practice-clock" data-phase="idle" aria-label="Start timer">
          <span class="practice-clock-value" id="practice-clock-value">0.00</span>
        </button>
        <ol class="practice-splits" id="practice-splits" hidden></ol>
        <p class="practice-status" id="practice-status">Space or tap to start · next scramble appears when you stop</p>
      </section>

      <section class="timer-side" aria-label="Solve times and progress">
        <div class="timer-toolbar">
          <label class="timer-inspect">
            Inspection
            <select id="timer-inspect" aria-label="Inspection time">
              <option value="0">0s</option>
              <option value="3">3s</option>
              <option value="5">5s</option>
              <option value="10">10s</option>
              <option value="15">15s</option>
            </select>
          </label>
          <label class="timer-chart-window">
            Chart
            <select id="timer-chart-window" aria-label="Chart solve window">
              <option value="25">Last 25</option>
              <option value="50" selected>Last 50</option>
              <option value="100">Last 100</option>
              <option value="0">All</option>
            </select>
          </label>
          <button type="button" class="btn btn-ghost btn-small" id="timer-clear" disabled>Clear times</button>
        </div>
        <div class="timer-stats" id="timer-stats"></div>
        <div class="timer-split-stats" id="timer-split-stats"></div>
        <div class="timer-chart" id="timer-chart" aria-live="polite"></div>
        <h2 class="timer-times-title">Times</h2>
        <div class="timer-times" id="timer-times"></div>
      </section>
    </main>

    <dialog class="timer-chart-dialog" id="timer-chart-dialog" aria-labelledby="timer-chart-dialog-title">
      <div class="timer-chart-dialog-panel">
        <header class="timer-chart-dialog-head">
          <h2 id="timer-chart-dialog-title">Progress</h2>
          <button type="button" class="btn btn-ghost btn-small" id="timer-chart-dialog-close">Close</button>
        </header>
        <p class="timer-chart-dialog-hint">Hover or tap a point to see that solve</p>
        <div class="timer-chart timer-chart-is-enlarged" id="timer-chart-enlarged"></div>
      </div>
    </dialog>

    <footer class="foot">
      <span>Works offline · times stay on this device</span>
      <span>Space or tap the clock · in split mode that also records Cross, F2L, then Final</span>
    </footer>

    <script type="module" src="js/timer-page.js?v=best2"></script>
  </body>
</html>
